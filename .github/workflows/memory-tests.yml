name: Memory regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  memory-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade numpy PyYAML
      - name: Run memory regression suite
        run: python tests/test_memory.py
      - name: Run emotional appraisal tests
        run: python tests/test_appraisal.py
      - name: Run drive regression tests
        run: python tests/test_drives.py
